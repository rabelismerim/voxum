<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente de cor idêntico ao da imagem (tons de magenta e roxo) -->
    <linearGradient id="voxumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc00ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Filtro de brilho (glow) para dar o efeito néon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)" transform="translate(10, 10)">
    <!-- Barras verticais estilizadas da esquerda para a direita formando o conceito sonoro/V -->
    <rect x="5" y="15" width="8" height="35" rx="4" fill="url(#voxumGradient)" opacity="0.8" />
    <rect x="18" y="25" width="8" height="40" rx="4" fill="url(#voxumGradient)" opacity="0.9" />

    <!-- Barra central curva/inclinada formando a base do V -->
    <path d="M 31 35 L 40 60 L 49 35" fill="none" stroke="url(#voxumGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="42" y="25" width="8" height="40" rx="4" fill="url(#voxumGradient)" opacity="0.9" />
    <rect x="55" y="10" width="8" height="50" rx="4" fill="url(#voxumGradient)" />
  </g>
</svg>
