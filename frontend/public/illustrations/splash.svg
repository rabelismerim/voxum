   <style>
      #h {
         animation: h 4s infinite;
      }
      @keyframes h {
         30% {transform: translateY(20px)}
         50% {transform: translateY(-24px)}
         70% {transform: translateY(20px)}
      }
      #b {
         transform-origin: 50% 67.5%;
         animation: b 4s infinite;
      }
      @keyframes b {
         30% {transform: scale(1)}
         50% {transform: scale(0.9)}
         70% {transform: scale(1)}
      }
      #g {
         animation: g 4s infinite;
      }
      @keyframes g {
         30% {height: 560px}
         50% {height: 510px}
         70% {height: 560px}
      }
      #s1 {
         transform-origin: 74% 25%;
         animation: s 4s 0.5s infinite;
      }
      #s2 {
         transform-origin: 34% 25%;
         animation: s 4s 0.6s infinite;
      }
      #s3 {
         transform-origin: 75% 45%;
         animation: s 4s 0.4s infinite;
      }
      @keyframes s {
         0% {transform: scale(0.1); opacity: 0;}
         30% {transform: scale(0.1); opacity: 0;}
         50% {transform: scale(1); opacity: 1;}
         100% {transform: scale(1.5); opacity: 0;}
      }
   </style>
