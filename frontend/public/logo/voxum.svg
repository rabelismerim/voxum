<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente Principal para o Ícone -->
    <linearGradient id="voxum-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <!-- Gradiente do Texto -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Sombra para dar profundidade -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF0080" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo Escuro Elegante (Opcional, pode remover para fundo transparente) -->
  <rect width="100%" height="100%" rx="16" fill="#0D0F17" />

  <g transform="translate(40, 40)">
    <!-- Ícone Voxum (V em forma de Ondas de Som/Voz) -->
    <g filter="url(#glow)">
      <!-- Barra 1 (Esquerda) -->
      <rect x="20" y="20" width="14" height="40" rx="7" fill="url(#voxum-grad)" opacity="0.7" />

      <!-- Barra 2 -->
      <rect x="42" y="35" width="14" height="60" rx="7" fill="url(#voxum-grad)" opacity="0.9" />

      <!-- Barra Central (Vértice do V) -->
      <path d="M 64 60 L 78 100 A 7 7 0 0 0 92 100 L 106 60" stroke="url(#voxum-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Barra 4 -->
      <rect x="92" y="25" width="14" height="70" rx="7" fill="url(#voxum-grad)" opacity="0.9" />

      <!-- Barra 5 (Direita) -->
      <rect x="114" y="10" width="14" height="50" rx="7" fill="url(#voxum-grad)" opacity="0.7" />
    </g>

    <!-- Tipografia "VOXUM" -->
    <text x="175" y="88"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="64"
          font-weight="800"
          letter-spacing="6"
          fill="url(#text-grad)">
      VOXUM
    </text>

    <!-- Ponto/Acento Decorativo -->
    <circle cx="485" cy="80" r="6" fill="#FF0080" />
  </g>
</svg>
