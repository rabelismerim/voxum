version: 1
formatters:
    default:
        format: "[%(levelname)s] %(asctime)s - %(name)s - %(funcName)s:%(lineno)d - %(message)s"
handlers:
    console:
        class: logging.StreamHandler
        stream: ext://sys.stderr
        formatter: default
loggers:
    uvicorn:
        handlers: [console]
        level: INFO
        propagate: no
    uvicorn.error:
        handlers: [console]
        level: INFO
        propagate: no
    uvicorn.access:
        handlers: [console]
        level: INFO
        propagate: no
root:
    level: INFO
    handlers: [console]
